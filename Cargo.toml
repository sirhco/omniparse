[package]
name = "omniparse"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
authors = ["Chris Olson"]
description = "A Rust toolkit for detecting and extracting metadata, text, and content from various file formats"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sirhco/omniparse"
keywords = ["parser", "extraction", "pdf", "ocr", "metadata"]
categories = ["parsing", "text-processing"]

[lib]
name = "omniparse"
path = "src/lib.rs"

[[bin]]
name = "omniparse"
path = "src/main.rs"

[dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
serde_yaml = "0.9"
csv = "1.3"
quick-xml = "0.31"
zip = "0.6"
tar = "0.4"
image = "0.24"
kamadak-exif = "0.5"
flate2 = "1.0"

# PDF parsing stack — gated by the `pdf` feature (on by default). lopdf is
# the strict-tier parser; weezl + ascii85 power additional stream-filter
# decoders in the lenient raw_scan fallback tier. All three are pure-Rust.
lopdf = { version = "0.32", optional = true }
weezl = { version = "0.1", optional = true }
ascii85 = { version = "0.2", optional = true }
# Alternative PDF parser used as a 4th-tier fallback when the lopdf chain
# fails entirely (linearized PDFs, Identity-H + /ToUnicode CMaps — e.g.,
# Lucidchart exports, Word/PowerPoint print-to-PDF). Opt-in.
pdf-extract = { version = "0.7", optional = true }

# Optional format-specific parsers (default on; users can turn off for
# slimmer dependency trees via --no-default-features).
pulldown-cmark = { version = "0.10", optional = true, default-features = false }
rbook = { version = "0.7", optional = true, default-features = false }
id3 = { version = "1", optional = true }

# HTML and CSS parsing
scraper = "0.18"
cssparser = "0.31"

# Excel/Spreadsheet support
calamine = "0.24"

# Optional dependencies
tokio = { version = "1.0", features = ["fs", "io-util", "macros", "rt-multi-thread"], optional = true }
rayon = { version = "1.10", optional = true }

# Classical OCR stack (optional). No ML runtime, no downloaded models —
# everything ships in the crate.
imageproc = { version = "0.23", optional = true }
symspell = { version = "0.5", optional = true }
log = { version = "0.4", optional = true }
ab_glyph = { version = "0.2", optional = true }
# ML OCR stack (optional). Pure Rust but pulls an ML runtime and downloads
# pre-trained models on first use.
ocrs = { version = "0.12", optional = true }
rten = { version = "0.24", optional = true }
rten-imageproc = { version = "0.24", optional = true }
dirs = { version = "5", optional = true }
ureq = { version = "2", features = ["tls"], optional = true }
sha2 = { version = "0.10", optional = true }

[features]
default = ["pdf", "markdown", "svg", "webp", "epub", "mp3"]
async = ["tokio"]
parallel = ["rayon"]
markdown = ["dep:pulldown-cmark"]
svg = []       # reuses existing quick-xml
webp = []      # reuses existing image + kamadak-exif
epub = ["dep:rbook"]
mp3 = ["dep:id3"]
# PDF parsing via `lopdf` (strict tier) + `weezl`/`ascii85` (raw_scan tier).
# On by default; disable with `--no-default-features` for builds that don't
# need PDF support.
pdf = ["dep:lopdf", "dep:weezl", "dep:ascii85"]
# 4th-tier fallback via `pdf-extract`. Captures Lucidchart-style /
# linearized / Identity-H-CMap PDFs that lopdf-based tiers can't load.
# Implies `pdf`.
pdf-extract = ["pdf", "dep:pdf-extract"]
ocr = [
    "dep:imageproc",
    "dep:symspell",
    "dep:log",
]
# Enable parallel per-region recognition inside OCR. Implies `ocr` + `parallel`.
ocr-parallel = ["ocr", "parallel"]
# ML-based OCR via ocrs + rten. Pure Rust but requires downloading ~30 MB of
# pre-trained models on first use. Implies `ocr`.
ocr-ml = [
    "ocr",
    "dep:ocrs",
    "dep:rten",
    "dep:rten-imageproc",
    "dep:dirs",
    "dep:ureq",
    "dep:sha2",
]
# Extra capability: train new glyph prototypes from a TrueType/OpenType font.
# Pulls `ab_glyph` (pure-Rust font rasterizer). Implies `ocr`.
ocr-train = ["ocr", "dep:ab_glyph"]

[dev-dependencies]
futures = "0.3"
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.8"
# Example dependencies
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1.0", features = ["full", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["multipart", "json", "rustls-tls", "blocking"] }
# production web service example (`examples/web_service_prod.rs`)
tower = { version = "0.5", features = ["limit", "timeout", "util"] }
tower-http = { version = "0.6", features = ["trace", "timeout", "limit", "cors", "catch-panic", "request-id", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.23"
metrics-exporter-prometheus = { version = "0.15", default-features = false }
subtle = "2"
uuid = { version = "1", features = ["v4"] }
num_cpus = "1"
serde_json = "1"
