[package]
name = "omniparse"
version = "0.2.1"
edition = "2024"
authors = ["Chris Olson"]
description = "A Rust toolkit for detecting and extracting metadata, text, and content from various file formats"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sirhco/omniparse"
keywords = ["parser", "extraction", "metadata", "mime", "content"]
categories = ["parsing", "text-processing"]

[lib]
name = "omniparse"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "omniparse"
path = "src/main.rs"

[dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
serde_yaml = "0.9"
csv = "1.3"
quick-xml = "0.31"
lopdf = "0.32"
zip = "0.6"
tar = "0.4"
image = "0.24"

# HTML and CSS parsing
scraper = "0.18"
cssparser = "0.31"

# Excel/Spreadsheet support
calamine = "0.24"

# Optional dependencies
tokio = { version = "1.0", features = ["fs", "io-util", "macros", "rt-multi-thread"], optional = true }
rayon = { version = "1.10", optional = true }
pyo3 = { version = "0.22", features = ["extension-module", "generate-import-lib"], optional = true }

[features]
default = []
async = ["tokio"]
parallel = ["rayon"]
python = ["pyo3"]

[dev-dependencies]
futures = "0.3"
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.8"
# Example dependencies
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", features = ["multipart", "json"] }
